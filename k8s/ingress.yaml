apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tp-deploiement-ingress
  namespace: tp-deploiement
spec:
  ingressClassName: traefik
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
